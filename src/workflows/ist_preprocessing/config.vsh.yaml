name: ist_preprocessing
namespace: workflows
description: |
  Run a single iST preprocessing pipeline: one method per step, chosen in `--methods_config`.
  Stops after aggregating the processed data into one SpatialData zarr; no metrics are computed.

  File formats are those of task_ist_preprocessing, see
  https://github.com/openproblems-bio/task_ist_preprocessing/tree/main/src/api

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_sp"
        type: file
        direction: input
        required: true
        description: Raw iST data as a SpatialData zarr (task_ist_preprocessing `file_raw_ist` format).
        example: raw_ist.zarr
      - name: "--input_sc"
        type: file
        direction: input
        required: true
        description: Single-cell reference h5ad (task_ist_preprocessing `file_scrnaseq_reference` format).
        example: scrnaseq_reference.h5ad
      - name: "--methods_config"
        type: file
        direction: input
        required: false
        description: |
          YAML selecting one method (and optionally its arguments) per step, e.g.

            segmentation: {method: cellpose, args: {diameter: 30}}
            celltype_annotation: {method: tacco}

          Steps left out fall back to the defaults in configs/default_methods.yaml.
        example: configs/default_methods.yaml
  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        direction: output
        required: true
        description: Aggregated SpatialData zarr (raw data + assignments + QC column + corrected counts).
        default: "$id/output.zarr"
      - name: "--output_counts"
        type: file
        direction: output
        required: true
        description: Final corrected count matrix with cell types (h5ad).
        default: "$id/counts.h5ad"

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

# All methods come from task_ist_preprocessing (see `repositories` in /_viash.yaml).
